services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_URL: file:/data/kesher.db
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-KesherAdmin!23}
      MAP_CENTER_LAT: ${MAP_CENTER_LAT:-32.0853}
      MAP_CENTER_LNG: ${MAP_CENTER_LNG:-34.7818}
    volumes:
      - kesher-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
    expose:
      - "3000"

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  kesher-data:
